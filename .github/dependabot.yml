version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      dev-deps-patch:
        dependency-type: development
        update-types:
          - patch
        # Catch-all for leftover dev patches. Without these excludes it
        # siphons packages owned by the named groups above (e.g. @vitest/*
        # landed here instead of the vitest group), splitting a single
        # version line across two PRs that then conflict on merge.
        exclude-patterns:
          - 'storybook'
          - '@storybook/*'
          - 'vitest'
          - '@vitest/*'
    ignore:
      # Pinned at ~3.6.2 — 3.7+ added an exports map that blocks the
      # deep imports the carousel-element ShadowDOM patches depend on.
      - dependency-name: '@glidejs/glide'
      # Pinned by Vite+: `vite` is an alias of @voidzero-dev/vite-plus-core and
      # vitest/@vitest/* must match the Vitest version bundled with vite-plus.
      # They move together with a `vite-plus` bump (`npx vp migrate`), never alone.
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
